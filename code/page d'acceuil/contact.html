<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
	<link href="../bootstrap/bootstrap-examples/assets/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <title>Contact</title>
</head>
<style>
    body{
        background-image: url(../../images/geometric.jpg);
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }
    #formulaire {
        padding-bottom: 50px;
        padding-top: 100px;
        top: 50%;
        left: 50%;
    }
    
    .form-container {
        max-width: 80%;
        border: solid 2px black;
        box-shadow: 2px 2px 12px 3px rgba(0, 0, 0, 0.644);
        margin-left: 10%;
    }
    
    .form-content {
        background-color: beige;
        padding: 40px;
        border-radius: 13px;
    }
    
    .form-content h1 {
        font-size: 20px;
    }
    
    .separation {
        width: 100%;
        height: 2px;
        background-color: black;
    }
    
    .corps-formulaire {
        display: flex;
        flex-wrap: wrap;
        margin-bottom: 30px;
    }
    
    .gauche .groupe,
    .droite .groupe {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        position: relative; 
    }
    
    .gauche .groupe input,
    .droite .groupe textarea {
        margin-top: 5px;
        padding: 10px 5px 10px 30px;
        border: 1px solid #c9c9c9;
        outline-color: black;
        border-radius: 5px;
        text-align: left;
    }
    
    .gauche .groupe i,
    .droite .groupe i {
        position: absolute; 
        left: 10px;
        top: 70%; 
        transform: translateY(-50%);
        padding: 9px 8px;
        color: black;
    }
    
    .droite {
        margin-left: 15%;
    }
    
    .droite .groupe textarea {
        background-color: #f8f8f8;
        border: 2px solid black;
        outline: none;
        border-radius: 5px;
        resize: none;
        height: calc(72% + 125px);
        width: calc(100% + 300px); 
        box-sizing: border-box;
        vertical-align: top;
        padding-top: 230px;
    }
    
    .pied-formulaire {
        text-align: center;
    }
    
    .pied-formulaire button {
        margin-top: 0px;
        background-color: black;
        color: white;
        font-size: 15px;
        border: none;
        padding: 10px 50px;
        border-radius: 5px;
        outline: none;
        cursor: pointer;
        transition: transform 0.5s;
    }
    
    @media screen and (max-width: 920px) {
        .droite {
            margin-left: 0;
        }
    
        .corps-formulaire {
            flex-direction: column;
        }
    
        .droite .groupe textarea {
            height: auto;
            width: 100%; 
        }
    }
    
    @media screen and (max-width: 600px) {
        .form-container {
            margin-left: 5%;
            max-width: 90%;
        }
    
        .form-content {
            padding: 20px;
        }
    
        .pied-formulaire button {
            padding: 10px 30px;
            font-size: 14px;
        }
    }
    
</style>
<body>
    <a href="../page d'acceuil/accueil.php" style="color: black; font-size:40px;"><i class='bx bx-left-arrow-circle'></i></a> 

    <section id="formulaire">
        <div class="form-container">
            <form method="GET" action="message.php" class="form-content">
                <h1>Envoyez-nous un Message</h1>
                <div class="separation"></div>
                <div class="corps-formulaire">
                    <div class="gauche">
                        <div class="groupe">
                            <label for="Prénom">Prenom</label>
                            <input type="text" name="Prenom" required>
                            <i class="fa fa-user" aria-hidden="true"></i>
                        </div>
                        <div class="groupe">
                            <label for="Nom">Nom</label>
                            <input type="text" name="Nom" required>
                            <i class="fa fa-user" aria-hidden="true"></i>
                        </div>
                        <div class="groupe">
                            <label for="Email">Email</label>
                            <input type="text" name="Email" required>
                            <i class="fa fa-envelope" aria-hidden="true"></i>
                        </div>
                        <div class="groupe">
                            <label for="Téléphone">Telephone</label>
                            <input type="number" name="Telephone" required  placeholder="+221">
                            <i class="fa fa-phone" aria-hidden="true"></i>
                        </div>
                    </div>
                    <div class="droite">
                        <div class="groupe">
                            <label for="Message">Message</label>
                            <textarea name="Message" required></textarea>
                        </div>
                    </div>
                </div>
                <div class="pied-formulaire">
                    <button type="submit" name="submit" value="ok">Envoyer le Message</button>
                </div>
            </form>
        </div>
    </section>
    

</body>
</html>
